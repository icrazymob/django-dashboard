[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dashboard"
version = "0.1.0"
description = "Self-contained Django app: declarative time-series metrics + JSON API + admin-styled dashboard page."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "icrazymob" },
]
keywords = ["django", "dashboard", "admin", "metrics", "charts", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
]

[project.urls]
Homepage = "https://github.com/icrazymob/django-dashboard"
Repository = "https://github.com/icrazymob/django-dashboard"
Issues = "https://github.com/icrazymob/django-dashboard/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dashboard", "dashboard.*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
dashboard = [
    "templates/**/*.html",
    "static/**/*",
]
